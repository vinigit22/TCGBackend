spring.application.name=backendTCG

server.port=8080

# ---------------------------------------------------------------------
# Perfil de banco de dados
#   h2    -> banco em memoria, sem instalar nada (TEMPORARIO, para testes)
#   mysql -> banco real, criado pelo script TorneioTCG_SQL.sql
# Sem perfil informado, sobe com o H2. Para usar o MySQL:
#   --spring.profiles.active=mysql   ou   SPRING_PROFILES_ACTIVE=mysql
# Quando o H2 deixar de ser usado, troque o valor abaixo para mysql.
# ---------------------------------------------------------------------
spring.profiles.default=h2

spring.jpa.open-in-view=false
# Busca os relacionamentos das listagens em lotes, em vez de uma consulta por registro (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------------------------------------------------------------
# JWT. JWT_SECRET e obrigatorio (minimo 32 caracteres); so o perfil h2 tem um valor padrao.
# ---------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
# 24 horas
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

# ---------------------------------------------------------------------
# Administrador criado na primeira execucao (AdminInitializer).
# Sem ADMIN_SENHA ele nao e criado; so o perfil h2 tem um valor padrao.
# ---------------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:admin@tcg.com}
app.admin.senha=${ADMIN_SENHA:}
app.admin.nome=Administrador

# ---------------------------------------------------------------------
# CORS: enderecos do front-end que podem chamar a API (separados por virgula)
# ---------------------------------------------------------------------
app.cors.origens=${CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*}

# ---------------------------------------------------------------------
# Email (redefinicao de senha).
# Configure o SMTP com SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD.
# Sem SPRING_MAIL_HOST, os emails sao apenas escritos no log da aplicacao.
# ---------------------------------------------------------------------
app.email.remetente=${MAIL_FROM:nao-responda@tcg.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# Agendador: encerra inscricoes vencidas e envia lembretes (intervalo em ms)
# ---------------------------------------------------------------------
app.agendador.intervalo-ms=${AGENDADOR_INTERVALO_MS:60000}

# ---------------------------------------------------------------------
# Upload de imagens (foto de perfil). Os arquivos ficam no disco do servidor, nesta pasta
# (relativa a pasta em que a API e iniciada), e sao servidos em GET /uploads/**.
# No banco vai so o caminho "/uploads/...": o front completa com o endereco da API.
# ---------------------------------------------------------------------
app.upload.diretorio=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
