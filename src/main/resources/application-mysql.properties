# ---------------------------------------------------------------------
# Perfil "mysql": banco real
# Rode o TorneioTCG_SQL.sql antes de subir a aplicacao: ele cria o banco
# tcg_torneios com tabelas, triggers, views, procedures e dados de teste.
# Os valores podem ser trocados por variaveis de ambiente.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tcg_torneios?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# O schema pertence ao script SQL; o Hibernate nao cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=none
