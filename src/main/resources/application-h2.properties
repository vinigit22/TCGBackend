# ---------------------------------------------------------------------
# Perfil "h2": banco em memoria para testes (TEMPORARIO)
# Nao precisa instalar nada. Os dados sao apagados a cada reinicio.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:tcg_torneios;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas a partir das entidades a cada inicializacao
spring.jpa.hibernate.ddl-auto=create-drop

# Depois das tabelas, roda os scripts do H2:
#   h2/schema.sql -> views e procedures (as procedures sao metodos Java da classe H2Procedures)
#   h2/data.sql   -> os mesmos dados de teste do TorneioTCG_SQL.sql, com senhas validas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2/schema.sql
spring.sql.init.data-locations=classpath:h2/data.sql

# Console web para consultar o banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
